# CSV data sources (supports classpath:, file:, https: prefixes)
restaurant.data.restaurants-file=classpath:restaurants.csv
restaurant.data.cuisines-file=classpath:cuisines.csv

# Max number of restaurants returned by search
restaurant.search.max-results=5

# Search criteria validation bounds
restaurant.search.criteria.rating-min=1
restaurant.search.criteria.rating-max=5
restaurant.search.criteria.distance-min=1
restaurant.search.criteria.distance-max=10
restaurant.search.criteria.price-min=10
restaurant.search.criteria.price-max=50
